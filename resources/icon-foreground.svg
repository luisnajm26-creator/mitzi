<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <!-- Primer plano: libro abierto con audífonos encima. Todo dentro del círculo seguro
       de Android (centro 54,54, radio 33) para que ningún teléfono lo recorte -->
  <defs>
    <linearGradient id="fg-izq" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8f1e5"/>
      <stop offset="0.8" stop-color="#efe4d1"/>
      <stop offset="1" stop-color="#d9c8ab"/>
    </linearGradient>
    <linearGradient id="fg-der" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#f6eee0"/>
      <stop offset="0.8" stop-color="#ebdfca"/>
      <stop offset="1" stop-color="#d2c09f"/>
    </linearGradient>
    <radialGradient id="fg-copa" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#3b383f"/>
      <stop offset="0.55" stop-color="#1b1a1e"/>
      <stop offset="1" stop-color="#0e0d10"/>
    </radialGradient>
  </defs>

  <!-- sombra del libro sobre la sábana -->
  <path d="M27 44 L85 46 L86 84 L25 82 Z" fill="#3a2a1a" opacity="0.25" transform="rotate(12 55 62)"/>

  <g transform="rotate(12 54 59)">
    <!-- tapa -->
    <path d="M25 39.5 Q25 38 26.5 38 L81.5 38 Q83 38 83 39.5 L84 78.5 Q84 80 82.5 80 L25.5 80 Q24 80 24 78.5 Z" fill="#1d1b1f"/>
    <!-- canto de las hojas -->
    <path d="M27.5 76 Q41 73.2 54 77 Q67 73.2 80.5 76 L80.5 78 Q67 75.4 54 79.2 Q41 75.4 27.5 78 Z" fill="#cdb995"/>
    <path d="M27.5 77 Q41 74.3 54 78.1 Q67 74.3 80.5 77" stroke="#b39d77" stroke-width="0.4" fill="none"/>
    <!-- páginas -->
    <path d="M27.5 41.5 Q41 38 54 42.8 L54 77 Q41 73.2 27.5 76 Z" fill="url(#fg-izq)"/>
    <path d="M80.5 41.5 Q67 38 54 42.8 L54 77 Q67 73.2 80.5 76 Z" fill="url(#fg-der)"/>
    <path d="M54 42.8 L54 77" stroke="#b7a281" stroke-width="0.7"/>
    <!-- renglones -->
    <g stroke="#8d8273" stroke-width="0.9" stroke-linecap="round" opacity="0.85">
      <path d="M31 47 H50.5 M31 50.4 H50.5 M31 53.8 H49 M31 57.2 H50.5 M31 60.6 H47 M31 64 H50.5 M31 67.4 H50 M31 70.8 H43"/>
      <path d="M57.5 47 H77 M57.5 50.4 H77 M57.5 53.8 H77 M57.5 57.2 H75 M57.5 60.6 H77 M57.5 64 H77 M57.5 67.4 H72 M57.5 70.8 H77"/>
    </g>
    <!-- número de página -->
    <circle cx="74" cy="73.6" r="0.6" fill="#8d8273"/>
    <!-- luz cálida de la lámpara sobre la hoja derecha -->
    <ellipse cx="70" cy="52" rx="13" ry="9" fill="#fff6e2" opacity="0.45"/>
  </g>

  <!-- sombras de los audífonos sobre las hojas -->
  <ellipse cx="39.5" cy="61" rx="8.5" ry="10.5" fill="#2a1d12" opacity="0.22" transform="rotate(-18 39.5 61)"/>
  <ellipse cx="78" cy="60" rx="8.5" ry="10.5" fill="#2a1d12" opacity="0.22" transform="rotate(18 78 60)"/>

  <!-- diadema -->
  <path d="M37.5 50 Q55 17 75.5 49" stroke="#141316" stroke-width="5.4" fill="none" stroke-linecap="round"/>
  <path d="M39.4 47.6 Q55 21.5 73.4 46.6" stroke="#3d3a42" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.9"/>

  <!-- copa izquierda (con la pieza que la une a la diadema) -->
  <g transform="rotate(-18 37.5 57.5)">
    <rect x="35.2" y="44.6" width="4.6" height="5" rx="1.6" fill="#2a282d"/>
    <ellipse cx="37.5" cy="57.5" rx="8.6" ry="10.6" fill="url(#fg-copa)"/>
    <ellipse cx="38.8" cy="57.8" rx="5.6" ry="7.4" fill="#232126"/>
    <ellipse cx="38.8" cy="57.8" rx="5.6" ry="7.4" fill="none" stroke="#38353c" stroke-width="0.8"/>
    <ellipse cx="38.8" cy="57.8" rx="3.4" ry="5" fill="#1a191d"/>
    <ellipse cx="34.6" cy="52.4" rx="2.4" ry="1.3" fill="#6b6772" opacity="0.8"/>
  </g>
  <!-- copa derecha -->
  <g transform="rotate(18 75.5 56.5)">
    <rect x="73.2" y="43.6" width="4.6" height="5" rx="1.6" fill="#2a282d"/>
    <ellipse cx="75.5" cy="56.5" rx="8.6" ry="10.6" fill="url(#fg-copa)"/>
    <ellipse cx="74.2" cy="56.8" rx="5.6" ry="7.4" fill="#232126"/>
    <ellipse cx="74.2" cy="56.8" rx="5.6" ry="7.4" fill="none" stroke="#38353c" stroke-width="0.8"/>
    <ellipse cx="74.2" cy="56.8" rx="3.4" ry="5" fill="#1a191d"/>
    <ellipse cx="72.4" cy="51.4" rx="2.4" ry="1.3" fill="#6b6772" opacity="0.8"/>
  </g>
</svg>
